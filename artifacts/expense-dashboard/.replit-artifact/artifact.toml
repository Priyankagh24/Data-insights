kind = "web"
previewPath = "/"
title = "Enterprise Expense Analytics"
version = "1.0.0"
id = "artifacts/expense-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26062

[services.development]
run = "pnpm --filter @workspace/expense-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/expense-dashboard", "run", "build" ]
publicDir = "artifacts/expense-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26062"
BASE_PATH = "/"
